name: Test and release Windows app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '정식 배포 버전 (예: v0.1.1), 비우면 테스트만 실행'
        required: false
        type: string
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python main.py --smoke-test
  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - name: Verify release version
        shell: pwsh
        env:
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = python -c "import duoroster; print(duoroster.__version__)"
          $tag = if ($env:MANUAL_RELEASE_TAG) { $env:MANUAL_RELEASE_TAG } else { $env:GITHUB_REF_NAME }
          if ($tag -ne "v$version") { throw 'Tag and app versions differ' }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - run: python tools/build.py
      - name: Check packaged startup
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'duoroster-smoke.json'
          $process = Start-Process -FilePath (Resolve-Path 'dist/DuoRoster/DuoRoster.exe') -ArgumentList @('--smoke-test', '--smoke-report', $report) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Packaged startup failed' }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw 'Packaged smoke report failed' }
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem release -File | ForEach-Object { $_.FullName }
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets --target $env:GITHUB_SHA --title "두 사람 근무표 $env:RELEASE_TAG" --generate-notes
          }
